services:
  - type: web
    name: careerpilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerpilot-db
          property: connectionString

databases:
  - name: careerpilot-db
    plan: free
    databaseName: careerpilot_db
    user: careerpilot_user